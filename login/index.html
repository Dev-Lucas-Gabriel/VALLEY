<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-card">
        <div class="left">
            <img src="./Captura_de_Tela_2026-03-16_às_17.44.40-removebg-preview.png" alt="ilustração">
        </div>
        <div class="right">
            <h3>Faça login na nossa plataforma</h3>
            <form>
                <div class="input-box">
                    <input type="text" placeholder="Usuário">
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Senha">
                </div>
                <div class="options">
                    <label>
                        <input type="checkbox"> Lembrar-me
                    </label>
                    <a href="#">Esqueceu a senha?</a>
                </div>
                <button>Entrar</button>
                <p class="register">
                    Não tem conta? <a href="#">Cadastre-se</a>
                </p>
                <div class="social">
                    <p>Logar com</p>
                    <div class="icons">
                        <img src="./Captura_de_Tela_2026-03-16_às_17.47.08-removebg-preview.png">
                        <img src="./Captura_de_Tela_2026-03-16_às_17.46.56-removebg-preview.png">
                        <img src="./Captura_de_Tela_2026-03-16_às_17.47.03-removebg-preview.png">
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
